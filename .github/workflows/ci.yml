name: CI

# Camouflage for web: typecheck, lint, the layer and side-effect checks, and the tests in Chromium, Firefox and WebKit
# on every pull request (see the docs: Project Setup (web) and Testing).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (typecheck, lint, layers, tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # pnpm comes from the `packageManager` field, through Corepack.
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm themes:check
      - run: pnpm typings:check
      - run: pnpm layers
      - run: pnpm skins
      - run: pnpm side-effects
      - run: pnpm test
      # Fails when an entry is over its gzip budget (tools/size-budget.mjs).
      - run: pnpm size
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-failures
          path: |
            .vitest/attachments
            **/test-results
          if-no-files-found: ignore

  # The scenario screenshots (scenarios/scenarios.json, through Storybook) in all three browsers. A baseline that is not
  # committed yet is recorded, not failed: download the `screenshots` artifact and commit the `-linux.png` files from it.
  screenshots:
    name: Screenshots (Chromium, Firefox, WebKit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm build
      - run: pnpm storybook:build
      - run: pnpm --filter @srctool/camouflage-storybook e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: |
            apps/storybook/e2e/screenshots
            apps/storybook/test-results
          if-no-files-found: ignore
